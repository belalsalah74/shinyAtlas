name: Validate Shiny Atlas and resolver bridge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install resolver dependency
        run: python -m pip install -r resolver-service/requirements.txt
      - name: Check JavaScript syntax and shiny-roll vectors
        run: |
          node --check server.mjs
          node --check app.js
          node test-shiny-roll.mjs
      - name: Compile Python service
        run: python -m py_compile resolver-service/app.py
      - name: Run resolver API validation tests
        run: python -m unittest discover -s resolver-service -v
